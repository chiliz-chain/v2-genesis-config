[profile.default]
src = "contracts"
out = "out"
script = "scripts"
libs = ["node_modules", "lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
    "ExcessivelySafeCall/=lib/ExcessivelySafeCall/src/"
]
solc = "0.8.17"
optimizer = true
optimizer_runs = 50
gas_limit = "18446744073709551615"  # max — the reconstruction script does many SSTOREs; default 2^30 OOMs
fs_permissions = [
    { access = "read", path = "./"},
    # Generated correction data: the reconstruction output and the assembled applyCorrections calldata.
    # Granted on the directory rather than per file so a new output does not need a foundry.toml change.
    { access = "read-write", path = "./scripts/corrections"},
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
